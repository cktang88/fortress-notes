[project]
name = "fortress-notes-backend"
version = "0.1.0"
description = "Fortress Notes backend — Markdown notes, ColBERT search, LLM review"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.5",
    "uvicorn[standard]>=0.54.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "python-frontmatter>=1.3.0",
    "markdown-it-py>=4.3.0",
    "python-ulid>=4.1.0",
    "httpx>=0.28.1",
    "pylate>=1.6.0",
    "python-multipart>=0.0.33",
    "pillow>=13.0.0",
    "transformers>=5.22.2",
    "rapidocr>=3.10.0",
    "onnxruntime>=1.24.0",
    "pypdfium2>=5.0.0",
    "regex>=2026.11.9",
    # ColBERT on the GPU of Apple Silicon Macs (app/colbert_mlx.py); nowhere else.
    "mlx>=0.32.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
]

[tool.uv]
# Supply-chain cooldown (docs/dependencies.md): `uv lock` never picks a file uploaded in
# the last 7 days (the span is recorded in uv.lock; the cutoff is "now" whenever uv
# resolves). Install with `uv sync --frozen`: exactly the lockfile, never re-resolved.
# 0.11.8 reads relative cutoffs in uv.lock (Dependabot's uv is 0.11); from 0.12.12 uv
# also leaves out wheels added to an older release after the cutoff, which CI checks
# for every uv (.github/scripts/check_cooldown.py).
required-version = ">=0.11.8"
exclude-newer = "7 days"
# pylate pulls torch + transformers; keep it optional-friendly by allowing CPU wheels.
# pylate, fast-plaid, datasets and sympy pin old versions of these. We only use pylate's
# ColBERT encoder, never its PLAID index, so lift the pins to stay on current releases.
# torch's own CUDA libraries stay at the versions torch was built against.
# fast-plaid's native code is built for torch 2.11 only and segfaults on newer torch:
# don't use pylate's PLAID index (pylate.indexes) without pinning torch back.
override-dependencies = [
    "torch",
    "transformers",
    "fast-plaid",
    "ujson",
    "ninja",
    "fsspec",
    "mpmath",
]

[tool.ruff]
line-length = 100
