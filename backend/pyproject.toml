[project]
name = "fortress-notes-backend"
version = "0.1.0"
description = "Fortress Notes backend — Markdown notes, ColBERT search, LLM review"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "python-frontmatter>=1.1",
    "python-ulid>=2.7",
    "httpx>=0.28",
    "pylate>=1.1.4",
    "python-multipart>=0.0.12",
    "pillow>=11.0",
    "transformers>=4.50",
    "rapidocr-onnxruntime>=1.4",
]

[tool.uv]
# pylate pulls torch + transformers; keep it optional-friendly by allowing CPU wheels.

[tool.ruff]
line-length = 100
