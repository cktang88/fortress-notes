[project]
name = "fortress-notes-backend"
version = "0.1.0"
description = "Fortress Notes backend — Markdown notes, ColBERT search, LLM review"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.162.0",
    "uvicorn[standard]>=0.54.0",
    "pydantic>=2.14.3",
    "pydantic-settings>=2.16.2",
    "python-frontmatter>=1.3.0",
    "markdown-it-py>=4.2.0",
    "python-ulid>=4.1.0",
    "httpx>=0.28.1",
    "pylate>=1.6.0",
    "python-multipart>=0.0.33",
    "pillow>=13.0.0",
    "transformers>=5.22.1",
    "rapidocr-onnxruntime>=1.4.4",
    "regex>=2026.9.29",
]

[tool.uv]
# pylate pulls torch + transformers; keep it optional-friendly by allowing CPU wheels.
# pylate, fast-plaid, datasets and sympy pin old versions of these. We only use pylate's
# ColBERT encoder, never its PLAID index, so lift the pins to stay on current releases.
# torch's own CUDA libraries stay at the versions torch was built against.
# fast-plaid's native code is built for torch 2.11 only and segfaults on newer torch:
# don't use pylate's PLAID index (pylate.indexes) without pinning torch back.
override-dependencies = [
    "torch",
    "transformers",
    "fast-plaid",
    "ujson",
    "ninja",
    "fsspec",
    "mpmath",
]

[tool.ruff]
line-length = 100
