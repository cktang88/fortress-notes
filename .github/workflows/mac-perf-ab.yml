# TEMPORARY (mac-code-audit): what makes a keystroke slower once a long note has loaded
# (chunked load, run-loop idle work, spell checking; run 2). Removed before merging.
name: mac perf A/B
on:
  push:
    branches: [mac-code-audit]
    paths: [".github/workflows/mac-perf-ab.yml"]
jobs:
  ab:
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: mac
    steps:
      - uses: actions/checkout@v5
      - run: swift build --build-tests
      - run: KEYSTROKE_PROFILE=1 swift test --skip-build --filter "KeystrokeProfile" 2>&1 | grep -E "PROFILE|✘|error"
