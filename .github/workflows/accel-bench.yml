# TEMPORARY (branch apple-accel only): Apple Silicon accelerator benchmark.
name: Accel bench

on:
  push:
    branches: [apple-accel]
    paths: ["backend/scripts/bench_accel.py", "backend/app/ocr.py", "backend/app/embeddings.py",
            "backend/app/colbert_mlx.py", ".github/workflows/accel-bench.yml"]

jobs:
  bench:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Install
        run: uv sync --frozen --python 3.13
      - name: Fetch the ColBERT model
        run: .venv/bin/python -c "from huggingface_hub import snapshot_download; snapshot_download('lightonai/Agent-ModernColBERT')"
      - name: Embedding tests on macOS (MLX parity on the GPU, routing)
        env:
          HF_HUB_OFFLINE: "1"
        run: |
          .venv/bin/python -m unittest discover -s tests -p test_colbert_mlx.py -v
          .venv/bin/python -m unittest discover -s tests -p test_embeddings.py
      - name: Bench OCR (CPU vs CoreML) and ColBERT (CPU, MLX, MPS), and the app's own choice
        run: |
          .venv/bin/python scripts/bench_accel.py all --out "$RUNNER_TEMP/accel" --reps 5 --tag main \
            --ocr-configs cpu,cpu_allcores,coreml_mlprogram_all,coreml_mlprogram_gpu \
            --colbert-configs cpu_fp32,cpu_fp32_allcores,mlx_fp32,mlx_fp16,mps_fp16
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: accel-${{ matrix.os }}
          path: ${{ runner.temp }}/accel
