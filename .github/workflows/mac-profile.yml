# TEMPORARY (editor-typing branch): loading/keystroke experiments, same runner A/B.
name: macOS editor profile

on:
  push:
    branches: [editor-typing]
    paths: ["mac/**", ".github/workflows/mac-profile.yml"]

jobs:
  profile:
    runs-on: macos-26
    timeout-minutes: 40
    defaults:
      run:
        working-directory: mac
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: swift build --build-tests
      - name: Experiments
        if: success() || failure()
        run: KEYSTROKE_PROFILE=1 swift test --filter LoadingExperiments 2>&1 | grep -E "EXP|PROFILE|error|✘|passed|failed" || true
      - name: Samples
        if: success() || failure()
        run: |
          mkdir -p profile
          KEYSTROKE_PROFILE=1 KEYSTROKE_SAMPLE_OUT="$PWD/profile/sample.txt" swift test --filter KeystrokeSample 2>&1 | grep -E "PROFILE|error|✘|passed|failed" || true
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: profile
          path: mac/profile
          if-no-files-found: ignore
