name: Picture description benchmark

# Research for docs/picture-descriptions.md: candidate models on Apple Silicon, with
# torch on the CPU, torch on the GPU (MPS) and MLX (mlx-vlm, in its own environment:
# it is not a dependency).
on:
  push:
    branches: [captions]
    paths: [".github/workflows/caption-bench.yml", "backend/scripts/caption_bench.py"]
  workflow_dispatch:

jobs:
  bench:
    runs-on: macos-26
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        runtime: [cpu, mps, mlx]
    env:
      HF_HOME: ${{ github.workspace }}/.hf
      TOKENIZERS_PARALLELISM: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.7"
      - name: Install
        working-directory: backend
        run: uv sync --frozen --python 3.13
      - name: Install mlx-vlm (separate environment)
        if: matrix.runtime == 'mlx'
        run: |
          uv venv "$RUNNER_TEMP/mlx" --python 3.13
          uv pip install --python "$RUNNER_TEMP/mlx/bin/python" "mlx-vlm==0.8.0"
      - name: Download the models
        working-directory: backend
        run: |
          uv run --frozen python -c "
          from huggingface_hub import snapshot_download
          for m in ['HuggingFaceTB/SmolVLM-256M-Instruct', 'HuggingFaceTB/SmolVLM-500M-Instruct',
                    'HuggingFaceTB/SmolVLM2-500M-Video-Instruct', 'florence-community/Florence-2-base',
                    'Qwen/Qwen3.5-0.8B']:
              print(snapshot_download(m, ignore_patterns=['onnx/*', '*.onnx', '*.gguf']))
          "
      - name: Benchmark
        working-directory: backend
        env:
          HF_HUB_OFFLINE: "1"
          RUNTIME: ${{ matrix.runtime }}
        run: |
          mkdir -p "$RUNNER_TEMP/out"
          for m in HuggingFaceTB/SmolVLM-256M-Instruct HuggingFaceTB/SmolVLM-500M-Instruct \
                   HuggingFaceTB/SmolVLM2-500M-Video-Instruct florence-community/Florence-2-base Qwen/Qwen3.5-0.8B; do
            case $m in *Florence*) prompts="--prompt cap";; *) prompts="--prompt one --prompt short";; esac
            out="$RUNNER_TEMP/out/$(basename $m)-$RUNTIME.json"
            if [ "$RUNTIME" = mlx ]; then
              "$RUNNER_TEMP/mlx/bin/python" scripts/caption_bench.py "$m" --runtime mlx $prompts --out "$out" 2>&1 | tee -a "$RUNNER_TEMP/bench.log" || true
            else
              uv run --frozen python scripts/caption_bench.py "$m" --device "$RUNTIME" $prompts --out "$out" 2>&1 | tee -a "$RUNNER_TEMP/bench.log" || true
            fi
          done
          { echo '```'; grep -E "^RESULT|Error" "$RUNNER_TEMP/bench.log" || true; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: caption-bench-${{ matrix.runtime }}
          path: ${{ runner.temp }}/out
