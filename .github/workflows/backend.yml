name: Backend

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Install
        working-directory: backend
        run: uv sync --frozen --python 3.13
      - name: Unit tests
        working-directory: backend
        # No model downloads and no LLM key in CI: tests that need them use fakes or skip.
        env:
          HF_HUB_OFFLINE: "1"
          OPENROUTER_API_KEY: ""
        run: uv run --frozen python -m unittest discover -s tests
