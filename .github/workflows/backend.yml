name: Backend

on:
  push:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # uv itself is pinned too (docs/dependencies.md): a release at least 7 days old.
          version: "0.13.7"
      - name: Install
        working-directory: backend
        run: uv sync --frozen --python 3.13
      - name: Unit tests
        working-directory: backend
        # No model downloads and no LLM key in CI: tests that need them use fakes or skip.
        env:
          HF_HUB_OFFLINE: "1"
          OPENROUTER_API_KEY: ""
        run: uv run --frozen python -m unittest discover -s tests

  # Apple Silicon, with the real ColBERT model: EMBEDDINGS_DEVICE=auto picks the MLX
  # GPU encoder here (app/colbert_mlx.py), which Linux never runs. Besides the whole
  # suite (where the real-model tests stop skipping: test_colbert_mlx, test_ocr's
  # RealColbertTests), tests/test_real_model.py runs encode, index, related, unified
  # search and Ask's prefetch on the CPU and on auto, checks the device chosen and
  # the rankings, and breaks the real MLX encoder to see the backend fall back.
  # The LLM stays a fake (no key).
  test-macos:
    runs-on: macos-26
    timeout-minutes: 25
    env:
      HF_HOME: ${{ github.workspace }}/.hf
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # uv itself is pinned too (docs/dependencies.md): a release at least 7 days old.
          version: "0.13.7"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install
        working-directory: backend
        run: uv sync --frozen --python 3.13
      # The model and the commit of its repository the backend pins (app/config.py).
      - name: Model revision
        id: model
        working-directory: backend
        run: |
          uv run --frozen python -c "from app.config import COLBERT_MODEL as m, COLBERT_REVISION as r; print(f'name={m}'); print(f'revision={r}'); print('dir=models--' + m.replace('/', '--'))" >> "$GITHUB_OUTPUT"
          cat "$GITHUB_OUTPUT"
      - name: Model cache
        id: model-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .hf/hub/${{ steps.model.outputs.dir }}
          key: hf-model-${{ steps.model.outputs.dir }}-${{ steps.model.outputs.revision }}
      - name: Download the model
        if: steps.model-cache.outputs.cache-hit != 'true'
        working-directory: backend
        env:
          MODEL: ${{ steps.model.outputs.name }}
          REVISION: ${{ steps.model.outputs.revision }}
        run: uv run --frozen python -c "import os; from huggingface_hub import snapshot_download; print(snapshot_download(os.environ['MODEL'], revision=os.environ['REVISION']))"
      - name: Unit tests (real model)
        working-directory: backend
        env:
          HF_HUB_OFFLINE: "1"
          OPENROUTER_API_KEY: ""
          FORTRESS_REAL_MODEL: "1"
          FORTRESS_REAL_COLBERT: "1"
          FORTRESS_EXPECT_EMBEDDINGS_DEVICE: mlx
        run: |
          set -o pipefail
          uv run --frozen python -m unittest discover -s tests -v 2>&1 | tee "$RUNNER_TEMP/tests.log"
      - name: Summary
        if: always()
        run: |
          {
            echo '```'
            grep -E "^REALMODEL|skipped|^Ran |^OK|^FAILED" "$RUNNER_TEMP/tests.log" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
