name: macOS app

on:
  push:
    paths: ["mac/**", "backend/app/batch.py", ".github/workflows/mac.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mac
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: swift build
      - name: Test and render snapshots
        run: SNAPSHOT_DIR="$PWD/snapshots" swift test --skip EditorPerformanceTests
      # On their own: the perf suite holds the main actor for long stretches, which made
      # timing-sensitive tests running beside it flaky, and its numbers noisy.
      - name: Editor performance
        run: |
          SNAPSHOT_DIR="$PWD/snapshots" swift test --filter EditorPerformanceTests 2>&1 | tee "$RUNNER_TEMP/perf.log"
          grep "^PERF" "$RUNNER_TEMP/perf.log" | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: mac/snapshots
          if-no-files-found: ignore

  # The data layer against the real backend, seeded with a few hundred notes: request
  # counts and latencies before/after caching and coalescing ([perf] lines in the log).
  integration:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Start the backend
        working-directory: backend
        run: |
          uv sync --frozen --python 3.13
          NOTES_DIR=$(mktemp -d) EMBEDDINGS_ENABLED=false VISION_ENABLED=false OPENROUTER_API_KEY= \
            nohup .venv/bin/uvicorn app.main:app --port 8000 > "$RUNNER_TEMP/backend.log" 2>&1 &
          for i in $(seq 1 120); do curl -sf http://127.0.0.1:8000/api/health && break; sleep 1; done
      - name: Seed notes
        run: python3 mac/Scripts/seed_backend.py http://127.0.0.1:8000 300
      - name: Integration tests
        working-directory: mac
        run: |
          FORTRESS_INTEGRATION_URL=http://127.0.0.1:8000 swift test --filter IntegrationTests 2>&1 | tee "$RUNNER_TEMP/integration.log"
          grep "\[perf\]" "$RUNNER_TEMP/integration.log" >> "$GITHUB_STEP_SUMMARY" || true
      - name: Backend log
        if: failure()
        run: tail -100 "$RUNNER_TEMP/backend.log"
