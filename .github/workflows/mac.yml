name: macOS app

on:
  push:
    branches: [main]
    paths: ["mac/**", ".github/workflows/mac.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version
          ls /Applications | grep -i xcode
