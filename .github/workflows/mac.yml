name: macOS app

on:
  push:
    # The integration job runs against the backend: API changes rebuild the client too.
    paths: ["mac/**", "backend/app/**", ".github/workflows/mac.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mac
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: swift build
      - name: Test and render snapshots
        run: SNAPSHOT_DIR="$PWD/snapshots" swift test --skip EditorPerformanceTests --skip ThemeGallerySnapshotTests
      # On their own: choosing a theme recolours every window in the process.
      - name: Theme snapshots
        if: success() || failure()
        run: SNAPSHOT_DIR="$PWD/snapshots" swift test --filter ThemeGallerySnapshotTests
      # On their own: the perf suite holds the main actor for long stretches, which made
      # timing-sensitive tests running beside it flaky, and its numbers noisy.
      - name: Editor performance
        if: success() || failure()
        run: |
          set -o pipefail
          SNAPSHOT_DIR="$PWD/snapshots" swift test --filter EditorPerformanceTests 2>&1 | tee "$RUNNER_TEMP/perf.log"
          grep "^PERF" "$RUNNER_TEMP/perf.log" | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY" || true
      # Finding's timing and request-count measurements, alone on the machine
      # (prints "PERF <name>: <value>" lines; see Tests/FortressKitTests/FindingPerfTests.swift).
      - name: Finding performance
        if: success() || failure()
        run: FINDING_PERF=1 swift test --filter FindingPerf
      - name: Upload snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: mac/snapshots
          if-no-files-found: ignore

  # The data layer against the real backend, seeded with a few hundred notes: request
  # counts and latencies before/after caching and coalescing ([perf] lines in the log).
  integration:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - name: Make the backend token
        # The backend requires it (backend/app/auth.py); the seed script and the tests
        # send it (BackendAuth takes FORTRESS_TOKEN from the environment).
        run: echo "FORTRESS_TOKEN=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
      - name: Start the backend
        working-directory: backend
        run: |
          uv sync --frozen --python 3.13
          NOTES_DIR=$(mktemp -d) EMBEDDINGS_ENABLED=false VISION_ENABLED=false OPENROUTER_API_KEY= \
            nohup .venv/bin/uvicorn app.main:app --port 8000 > "$RUNNER_TEMP/backend.log" 2>&1 &
          for i in $(seq 1 120); do curl -sf http://127.0.0.1:8000/api/health && break; sleep 1; done
          # Without the token the API refuses; with it, it answers.
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8000/api/navigation)" = 401
          curl -sf -H "X-Fortress-Token: $FORTRESS_TOKEN" http://127.0.0.1:8000/api/navigation > /dev/null
      - name: Seed notes
        run: python3 mac/Scripts/seed_backend.py http://127.0.0.1:8000 300
      - name: Integration tests
        working-directory: mac
        run: |
          set -o pipefail
          FORTRESS_INTEGRATION_URL=http://127.0.0.1:8000 swift test --filter IntegrationTests 2>&1 | tee "$RUNNER_TEMP/integration.log"
          grep "\[perf\]" "$RUNNER_TEMP/integration.log" >> "$GITHUB_STEP_SUMMARY" || true
      - name: Backend log
        if: failure()
        run: tail -100 "$RUNNER_TEMP/backend.log"
