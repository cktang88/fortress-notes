name: macOS app

on:
  push:
    branches: [main]
    paths: ["mac/**", ".github/workflows/mac.yml"]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mac
    steps:
      - uses: actions/checkout@v5
      - name: Build
        run: swift build
      - name: Test and render snapshots
        run: SNAPSHOT_DIR="$PWD/snapshots" swift test
      - name: Upload snapshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: snapshots
          path: mac/snapshots
          if-no-files-found: ignore
