[package]
name = "fortress-onenote"
version = "0.3.1"
edition = "2024"
rust-version = "1.88"
description = "Convert exported Microsoft OneNote notebooks into a JSON manifest and asset files for Fortress Notes"
publish = false

[dependencies]
anyhow = "1.0.104"
hex = "0.4.3"
onenote_parser = "2.1.0"
# .onepkg packages are CAB archives; we extract them ourselves (src/input.rs).
cab = "=0.6.0"
percent-encoding = "2.3.2"
regex = "1.13.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
time = { version = "0.3.55", features = ["formatting"] }
typed-path = "0.13"
zip = { version = "9.5.1", default-features = false, features = ["deflate", "deflate64"] }

[dev-dependencies]
hex = "0.4.3"
serde_json = "1.0.154"
sha2 = "0.11.1"
zip = { version = "9.5.1", default-features = false, features = ["deflate"] }

# Patched copies of onenote_parser (MPL-2.0) and cab (MIT): see vendor/PATCHES.md.
[patch.crates-io]
onenote_parser = { path = "vendor/onenote_parser" }
cab = { path = "vendor/cab" }

[profile.release]
lto = true
codegen-units = 1
strip = true
